[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[runner]
magicEnabled = true

[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[setup]
preRunCommand = "chmod +x setup.sh && apt-get update && apt-get install -y git curl && ./setup.sh" 